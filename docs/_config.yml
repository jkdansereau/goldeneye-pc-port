# GitHub Pages config. Site is served from the /docs folder on the default
# branch (Settings -> Pages -> Deploy from a branch -> main / docs).
title: GoldenEye 007 PC Port
description: >-
  A native PC port of the original Nintendo 64 GoldenEye 007, built from its
  decompiled source with a software RSP — plus the engineering record:
  internals, porting notes, and the two-agent development workflow.
theme: jekyll-theme-cayman
show_downloads: false

# Canonical site location - used by jekyll-seo-tag (canonical URLs, og: tags)
# and jekyll-sitemap (absolute URLs in sitemap.xml).
url: https://jkdansereau.github.io
baseurl: /goldeneye-pc-port

# Link-preview card image for jekyll-seo-tag (og:image / twitter:image).
# Path is relative to the site root; the plugin prepends url + baseurl.
image: /img/attract-bunker1.png

# Both are on the GitHub Pages plugin whitelist - no Gemfile needed.
# jekyll-seo-tag: per-page <title>/description/canonical/OpenGraph via {% seo %}
#   (already emitted by the Cayman layout).
# jekyll-sitemap: generates /sitemap.xml for Search Console / Bing submission.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# jekyll-relative-links (on by default for Pages) rewrites the .md links in
# these docs to .html so cross-links work on the published site. Links that
# must reach docs kept out of the site build point at the GitHub blob URL
# instead, so they resolve from the published pages too.

# ---------------------------------------------------------------------------
# The site publishes a small curated set (see docs/dev/notes/DE-SLOP-DOCS-PLAN.md):
#   index.md, building.md, internals.md, porting-notes.md, dev-process.md,
#   dev/agentic-development.md
# Everything else under docs/ is working material - the finding log, level
# status, backlogs, plans, inherited decomp guides. It stays in the repo (and
# on GitHub) but is excluded from the site build so it never shows up as a
# published page or in sitemap.xml.
exclude:
  - BACKLOG.md
  - HANDOFF.md
  - SetupGuide.md
  - StructureGuide.md
  - StyleGuide.md
  - dev/AUDIO-PLAN.md
  - dev/AUDIT-M6-player-offsets.md
  - dev/D172-PARTICLE-COLOR-RESEARCH.md
  - dev/D176a-SKY-NOTES.md
  - dev/GE-ENV-PROBES.md
  - dev/GRAPHICS-BACKLOG.md
  - dev/HANDOFF-ARCHIVE.md
  - dev/LEVEL-OBJECTIVES.md
  - dev/LEVEL-PLAYTEST.md
  - dev/LEVEL-STATUS.md
  - dev/LINUX-PORT.md
  - dev/M-35-PLAYTEST-CHECKLIST.md
  - dev/M-35-QOL-REVIEW.md
  - dev/M-36-TRIAGE.md
  - dev/MODERN-PORT-FEATURES-BACKLOG.md
  - dev/OPTIONS-MENU-PLAN.md
  - dev/QOL-INVENTORY.md
  - dev/TEXTURE-GLITCH-ANALYSIS.md
  - dev/UNLOCKED-FPS-PLAN.md
  - dev/VIEWMODEL-RESEARCH.md
  - dev/WIDESCREEN-FOV-PLAN.md
  - dev/findings-index.csv
  - dev/findings.md
  - dev/game-behavior-reference.md
  - dev/release-dropin-rom-plan.md
