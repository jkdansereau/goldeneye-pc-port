# Self-hosted runtime (ROM-gated)
#
# Builds, then runs the 21-level headless sweep on a SELF-HOSTED runner that
# has a legal ROM: the maintainer's box, or a contributor's own runner on a
# fork. This is the job class ci.yml explicitly does NOT do (CI is
# build-only, with no ROM). Setup for runner owners: docs/selfhosted-sweep.md.
#
#   platform=windows : MSYS2 box, tools_pc/verify.sh sweep (the original G1 job)
#   platform=macos   : Homebrew box, tools_pc/level_sweep_mac.sh
#                      (SCAFFOLD: not yet run end to end; it needs the arm64
#                      address model from #95 on the ref and exits early
#                      without it)
#
# ROM model (both platforms): the ROM + sidecars are copied from a seed
# directory on the runner, {runner_home}/_rom-seed by default, or the repo
# variable GE_ROM_SEED_DIR. The ROM's sha1 is re-verified every run against
# the committed ge007.u.sha1. The ROM is deliberately NOT stored in
# actions/cache: cache entries live on GitHub's side and pull_request
# workflows can restore base-branch caches, which would make the ROM readable
# to any PR's workflow.
#
# Trigger gating (non-negotiable):
#   - workflow_dispatch ONLY.
#   - NEVER add `pull_request`: unreviewed fork code must not be routable to
#     a runner that can see the ROM.
#
# Leak rules: nothing is uploaded from data/. Artifacts are console logs plus
# a JSON verdict only. Rendered frames (ppm/) are ROM-derived content and are
# NOT uploaded.

name: Self-hosted runtime

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Runner platform"
        required: true
        default: windows
        type: choice
        options: [ windows, macos ]
      runner_labels:
        description: 'Optional JSON array of runner labels, e.g. ["self-hosted","macOS","ARM64"] (blank = platform default)'
        required: false
        default: ""
        type: string
      levels:
        description: "Sweep subset, SWEEP_LEVELS format (blank = all 21; Windows only)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One ROM job at a time per ref; never cancel an in-flight sweep out from
# under itself. Group + cancel-in-progress:false is what serializes runs
# (workflow-level `concurrency` has no `max-parallel` key; a stray one is a
# hard parse error that blocks every dispatch).
concurrency:
  group: selfhosted-${{ github.ref }}
  cancel-in-progress: false

env:
  GE_ROM_SEED_DIR: ${{ vars.GE_ROM_SEED_DIR }}

jobs:
  windows-sweep:
    if: inputs.platform == 'windows'
    runs-on: ${{ inputs.runner_labels != '' && fromJSON(inputs.runner_labels) || fromJSON('["self-hosted","windows"]') }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `release: false` reuses the box's own C:\msys64 as-is (no pacman
      # -Syu / -S, no network). It still has to run: it registers the
      # `msys2 {0}` shell wrapper.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          release: false

      - name: Check self-hosted dependencies
        run: tools_pc/check-selfhosted-deps.sh

      - name: Stage ROM + sidecars (runner seed dir)
        run: |
          seed="${GE_ROM_SEED_DIR:-$(dirname "$(dirname "$RUNNER_WORKSPACE")")/_rom-seed}"
          for f in ge007.ntsc-final.z64 pcmodels-ntsc-final pccg-ntsc-final; do
            [ -e "$seed/$f" ] || {
              echo "missing $seed/$f" >&2
              echo "Copy ge007.ntsc-final.z64, pcmodels-ntsc-final/ and pccg-ntsc-final/ into $seed" >&2
              echo "(or set the repo variable GE_ROM_SEED_DIR). See docs/selfhosted-sweep.md." >&2
              exit 2
            }
          done
          mkdir -p data
          cp -r "$seed/ge007.ntsc-final.z64" "$seed/pcmodels-ntsc-final" \
                "$seed/pccg-ntsc-final" data/
          echo "staged ROM store from $seed"

      - name: Verify ROM integrity (committed US sha1)
        run: |
          want="$(cut -d' ' -f1 ge007.u.sha1)"
          got="$(sha1sum data/ge007.ntsc-final.z64 | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "ROM hash mismatch: want $want got $got" >&2; exit 2; }
          echo "ROM sha1 ok: $got"

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-selfhosted-${{ hashFiles('CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-selfhosted-${{ hashFiles('CMakeLists.txt') }}-
            ccache-selfhosted-

      - name: Regenerate ROM-asset symbol file (US)
        run: python scripts/gen_romassets.py u

      - name: Build (ntsc-final)
        run: ./build-pc.sh ntsc-final

      # verify.sh: build-if-stale -> headless GE_PCDUMP per level -> crash
      # symbolication -> pixcount -> framediff vs tools_pc/golden/. Serialized
      # + watchdog + one retry by design (D117: not frame-deterministic).
      - name: Level sweep (all 21, or dispatch subset)
        env:
          INPUT_LEVELS: ${{ inputs.levels }}
        run: |
          if [ -n "$INPUT_LEVELS" ]; then
            if ! printf '%s' "$INPUT_LEVELS" | grep -Eq '^[A-Za-z0-9]+:[0-9]+( [A-Za-z0-9]+:[0-9]+)*$'; then
              echo "levels input must be space-separated Name:NN entries, e.g. 'Dam:33 Facility:34'" >&2
              exit 1
            fi
            export SWEEP_LEVELS="$INPUT_LEVELS"
          fi
          tools_pc/verify.sh sweep --json > sweep.log 2>&1
          rc=$?
          cat sweep.log
          exit $rc

      - name: Extract JSON verdict
        if: always()
        run: |
          python -c "
          import json
          s = open('sweep.log', encoding='utf-8', errors='replace').read()
          i = s.rfind('[{')
          out = '[]'
          if i >= 0:
              d, _ = json.JSONDecoder().raw_decode(s[i:])
              out = json.dumps(d, indent=1)
          open('sweep-verdict.json', 'w').write(out + '\n')
          print(out)
          "

      # Console logs + verdict only: no frames, no ROM bytes (leak rules).
      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhosted-sweep-windows-${{ github.run_number }}
          path: |
            sweep.log
            sweep-verdict.json
            ge007.crash.log
          if-no-files-found: ignore
          retention-days: 14

  # SCAFFOLD (2026-09-30): written without a Mac runner to test on. Expect
  # small fixes on the first real run; please report them on the macos branch.
  macos-sweep:
    if: inputs.platform == 'macos'
    runs-on: ${{ inputs.runner_labels != '' && fromJSON(inputs.runner_labels) || fromJSON('["self-hosted","macOS","ARM64"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The arm64 build needs the port_addr model (#95). level_sweep_mac.sh
      # arrives with it too. Fail early and clearly on a ref without them.
      - name: Check ref has the arm64 address model
        run: |
          for f in port/src/port_addr.c tools_pc/level_sweep_mac.sh; do
            [ -f "$f" ] || {
              echo "$f not on this ref: the macOS sweep needs the arm64 work (#95) merged in." >&2
              exit 2
            }
          done

      - name: Check macOS dependencies (Homebrew)
        run: |
          missing=0
          for t in cmake python3 brew; do
            command -v "$t" >/dev/null || { echo "missing: $t" >&2; missing=1; }
          done
          if command -v brew >/dev/null; then
            ls "$(brew --prefix)"/bin/gcc-[0-9]* >/dev/null 2>&1 || { echo "missing: Homebrew gcc (gcc-N)" >&2; missing=1; }
            for p in sdl2 zlib; do
              brew list --versions "$p" >/dev/null || { echo "missing: brew $p" >&2; missing=1; }
            done
          fi
          [ "$missing" = 0 ] || { echo "Install with: brew install cmake gcc sdl2 zlib python3" >&2; exit 2; }

      - name: Stage ROM + sidecars (runner seed dir)
        run: |
          seed="${GE_ROM_SEED_DIR:-$(dirname "$(dirname "$RUNNER_WORKSPACE")")/_rom-seed}"
          for f in ge007.ntsc-final.z64 pcmodels-ntsc-final pccg-ntsc-final; do
            [ -e "$seed/$f" ] || {
              echo "missing $seed/$f" >&2
              echo "Copy ge007.ntsc-final.z64, pcmodels-ntsc-final/ and pccg-ntsc-final/ into $seed" >&2
              echo "(or set the repo variable GE_ROM_SEED_DIR). See docs/selfhosted-sweep.md." >&2
              exit 2
            }
          done
          mkdir -p data
          cp -R "$seed/ge007.ntsc-final.z64" "$seed/pcmodels-ntsc-final" \
                "$seed/pccg-ntsc-final" data/
          echo "staged ROM store from $seed"

      - name: Verify ROM integrity (committed US sha1)
        run: |
          want="$(cut -d' ' -f1 ge007.u.sha1)"
          got="$(shasum -a 1 data/ge007.ntsc-final.z64 | cut -d' ' -f1)"
          [ "$want" = "$got" ] || { echo "ROM hash mismatch: want $want got $got" >&2; exit 2; }
          echo "ROM sha1 ok: $got"

      - name: Regenerate ROM-asset symbol file (US)
        run: python3 scripts/gen_romassets.py u

      - name: Build (ntsc-final)
        run: |
          ./build-pc.sh ntsc-final
          # level_sweep_mac.sh runs build-pc/ge007.aarch64 (Apple Silicon only).
          [ -x build-pc/ge007.aarch64 ] || { echo "build-pc/ge007.aarch64 not produced (Intel Macs are not supported by the sweep script yet)" >&2; exit 2; }

      # level_sweep_mac.sh always exits 0, so the verdict step below decides
      # pass/fail from its results file (/tmp/mac_sweep_results). Its logs go
      # to /tmp/sweeplogs, which the script does not create itself.
      - name: Level sweep (all 21)
        run: |
          rm -rf /tmp/sweeplogs /tmp/mac_sweep_results
          mkdir -p /tmp/sweeplogs
          bash tools_pc/level_sweep_mac.sh 2>&1 | tee sweep.log

      - name: Extract JSON verdict (fails the job on CRASH/BLACK)
        if: always()
        run: |
          python3 - <<'PY'
          import json, re, sys
          try:
              lines = open('/tmp/mac_sweep_results', encoding='utf-8', errors='replace').read().splitlines()
          except OSError:
              lines = []
          rows, done = [], False
          for ln in lines:
              if ln.strip() == 'SWEEP DONE':
                  done = True
                  continue
              m = re.match(r'^(\S+) \((\d+)\): (\w+)\s*(.*)$', ln)
              if m:
                  rows.append({'level': m.group(1), 'num': m.group(2),
                               'status': m.group(3), 'detail': m.group(4).strip()})
          open('sweep-verdict.json', 'w').write(json.dumps(rows, indent=1) + '\n')
          print(json.dumps(rows, indent=1))
          bad = [r for r in rows if r['status'] != 'OK']
          if not done or not rows or bad:
              print(f"sweep FAILED: done={done} levels={len(rows)} non-OK={len(bad)}", file=sys.stderr)
              sys.exit(1)
          print(f"sweep OK: {len(rows)} levels")
          PY

      - name: Collect console logs
        if: always()
        run: |
          mkdir -p sweep-logs
          cp /tmp/sweeplogs/*.log sweep-logs/ 2>/dev/null || true

      # Console logs + verdict only: no frames, no ROM bytes (leak rules).
      - name: Upload sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selfhosted-sweep-macos-${{ github.run_number }}
          path: |
            sweep.log
            sweep-verdict.json
            sweep-logs/
          if-no-files-found: ignore
          retention-days: 14
